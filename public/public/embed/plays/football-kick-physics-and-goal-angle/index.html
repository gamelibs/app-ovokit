        window.__OVO_DATA = kernel.ctx.data;
        if (sm && events) {
          // 桥接全局事件总线到状态机：自动订阅所有状态迁移事件
          const eventIds = new Set();
          for (const state of blueprint.design.stateMachine.states) {
            if (state.on) {
              for (const eventId of Object.keys(state.on)) {
                eventIds.add(eventId);
              }
            }
          }
          for (const eventId of eventIds) {
            console.log('[Preview] 桥接事件:', eventId);
            events.on(eventId, (payload) => {
              console.log('[Preview] 收到事件:', eventId, payload);
              try {
                sm.transition(eventId, payload);
              } catch (e) {
                console.warn('[Preview] transition 失败:', eventId, e);
              }
            });
          }
        }
        if (sm) {
          statusEl.textContent = 'State: ' + sm.getState();

          // boot 自动推进兜底：初始状态为 boot 且存在迁移事件时，在事件桥接完成后自动触发
          const bootStateDef = blueprint.design?.stateMachine?.states?.find((s) => s.id === 'boot');
          if (sm.getState() === 'boot' && bootStateDef?.on) {
            const bootEvents = Object.keys(bootStateDef.on);
            if (bootEvents.length > 0 && events) {
              const eventToEmit = bootEvents[0];
              requestAnimationFrame(() => {
                console.log('[Preview] boot 自动推进:', eventToEmit);
                events.emit(eventToEmit, { auto: true });
              });
            }
          }

          sm.onStateChange((from, to) => {
            statusEl.textContent = 'State: ' + to;
            if (window.parent !== window) {
              window.parent.postMessage({ type: 'stateChanged', from, to, projectId: 'cp_1019_10165_football' }, '*');
            }
            // 自动渲染新状态的皮肤（状态 ID → 场景 ID → 场景 skin）
            const stateDef = blueprint.design.stateMachine.states.find(s => s.id === to);
            const sceneId = stateDef?.scene || to;
            const sceneDef = blueprint.design.scenes.find(s => s.id === sceneId);
            const skinName = sceneDef?.skin || '';
            const skinRenderer = kernel.ctx.system?.skinRenderer;
            if (skinRenderer?.renderSkinForScene) {
              // 先渲染全局皮肤（如果未渲染）
              renderGlobalSkin(skinRenderer);
              // 只销毁当前状态皮肤，保留全局皮肤
              const globalStateId = blueprint.design?.stateMachine?.globalState;
              const globalStateDef = globalStateId ? blueprint.design?.stateMachine?.states?.find(s => s.id === globalStateId) : null;
              const globalSceneId = globalStateDef?.scene || globalStateId || '';
              destroyActiveSkinOnly(skinRenderer, globalSceneId);
              // 渲染新状态皮肤
              try {
                const activeScene = { id: sceneId, skin: skinName, event: kernel.ctx.scene?.event, ui: kernel.ctx.scene?.ui };
                skinRenderer.renderSkinForScene(blueprint, activeScene, kernel.ctx.engine.stage);
              } catch (e) {
                console.warn('[Preview] 皮肤渲染失败:', e);
              }
            }
          });
          // 渲染初始状态皮肤（先全局，后当前）
          const skinRenderer = kernel.ctx.system?.skinRenderer;
          if (skinRenderer?.renderSkinForScene) {
            // 先渲染全局皮肤
            await renderGlobalSkin(skinRenderer);
            // 再渲染初始状态皮肤
            const initialStateDef = blueprint.design.stateMachine.states.find(s => s.id === sm.getState());
            const initialSceneId = initialStateDef?.scene || sm.getState();
            const initialSceneDef = blueprint.design.scenes.find(s => s.id === initialSceneId);
            const initialSkinName = initialSceneDef?.skin || '';
            try {
              const activeScene = { id: initialSceneId, skin: initialSkinName, event: kernel.ctx.scene?.event, ui: kernel.ctx.scene?.ui };
              await skinRenderer.renderSkinForScene(blueprint, activeScene, kernel.ctx.engine.stage);
            } catch (e) {
              console.warn('[Preview] 初始皮肤渲染失败:', e);
            }
          }
        }

        // Canvas 缩放以适应 preview iframe（使用设计尺寸，避免 PIXI autoDensity 改变 canvas.width 后缩放失真）
        const designWidth = Number(canvas.dataset.designWidth || canvas.width);
        const designHeight = Number(canvas.dataset.designHeight || canvas.height);
        function fitCanvas() {
          const container = canvas.parentElement;
          if (!container) return;
          const scale = Math.min(container.clientWidth / designWidth, container.clientHeight / designHeight, 1);
          canvas.style.width = (designWidth * scale) + 'px';
          canvas.style.height = (designHeight * scale) + 'px';
        }
        window.addEventListener('resize', fitCanvas);
        fitCanvas();

        if (window.parent !== window) {
          window.parent.postMessage({ type: 'previewReady', projectId: 'cp_1019_10165_football' }, '*');
        }
      } catch (err) {
        statusEl.textContent = 'Error: ' + err.message;
        statusEl.style.color = '#f87171';
        console.error('[Preview] 启动失败:', err);
      }
    }

    boot();

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'highlightState') {
        console.log('高亮状态:', e.data.stateId);
      }
    });
  </script>
</body>
</html>
