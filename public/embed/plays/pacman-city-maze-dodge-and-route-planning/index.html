    async function loadMarketModule(name) {
      try {
        const resp = await fetch('./modules/' + name + '.js');
        if (!resp.ok) return null;
        const code = await resp.text();
        if (!code) return null;
        // 使用 Blob URL 动态加载 ESM 模块
        const blob = new Blob([code], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        const mod = await import(/* @vite-ignore */ url);
        URL.revokeObjectURL(url);
        return mod.default || mod;
      } catch (e) {
        console.warn('[Preview] 加载市场模块失败:', name, e);

          }
          // three.min.js 就绪即挂 ctx.engine.three——引擎级（engine=threejs）与模块级
          // （蓝图模块 provides 含 render:threejs，由 extraRuntimeLibs 追加加载）两条路径都覆盖；
          // engine.name 只在引擎级 threejs 时改写，避免干扰 pixi 项目的皮肤层判断
          if (typeof window.THREE !== 'undefined') {
            kernel.ctx.engine.three = window.THREE;
            if (engine === 'threejs') kernel.ctx.engine.name = 'threejs';
            console.log('[Preview] Three.js 运行时库已加载');
          } else if (engine === 'threejs') {
            console.warn('[Preview] threejs 项目但 THREE 未加载成功');
          }
          if (engine !== 'pixi' && engine !== 'other' && engine !== 'threejs') {
            console.log('[Preview] 引擎库已加载:', engine);
          }
        } catch (e) {
          console.warn('[Preview] 引擎库加载失败，将使用 Canvas 2D 回退:', e);
        }

        await kernel.loadBlueprint(kernelBlueprint);

        // 加载项目数据资源到 ResMgr（静态导出时读本地 manifest + 静态 JSON 文件）
        try {
          const resResp = await fetch('./resources/data/manifest.json');
          if (resResp.ok) {
            const resData = await resResp.json();
            const dataFiles = (resData.files || []);
            for (const fileName of dataFiles) {
              const dataResp = await fetch('./resources/data/' + encodeURIComponent(fileName));
              if (dataResp.ok) {
                const dataContent = await dataResp.json();
                const dataId = fileName.replace(/\.json$/, '');
                if (kernel.ctx.system?.resMgr?.registerData) {
                  kernel.ctx.system.resMgr.registerData(dataId, dataContent);
                  console.log('[Preview] 注册数据资源:', dataId);
                }
              }
            }
          }
        } catch (e) {
          console.warn('[Preview] 加载数据资源失败:', e);
        }

        // 全局皮肤渲染辅助函数
        let globalSkinRendered = false;
        async function renderGlobalSkin(skinRenderer) {
          if (globalSkinRendered) return;
          const globalStateId = blueprint.design?.stateMachine?.globalState;
          if (!globalStateId) return;
          const globalStateDef = blueprint.design?.stateMachine?.states?.find(s => s.id === globalStateId);
          if (!globalStateDef) return;
          const globalSceneId = globalStateDef.scene || globalStateId;
          const globalScene = blueprint.design?.scenes?.find(s => s.id === globalSceneId);
          const globalSkinName = globalStateDef.skin || globalScene?.skin || '';
          if (!globalSkinName) return;
          try {
            const globalSceneRuntime = { id: globalSceneId, skin: globalSkinName, event: kernel.ctx.scene?.event, ui: kernel.ctx.scene?.ui };
            await skinRenderer.renderSkinForScene(blueprint, globalSceneRuntime, kernel.ctx.engine.stage);
            globalSkinRendered = true;
            console.log('[Preview] 全局皮肤渲染完成:', globalSkinName);
          } catch (e) {
            console.warn('[Preview] 全局皮肤渲染失败:', e);
          }
        }

        function destroyActiveSkinOnly(skinRenderer, globalSceneId) {
          // 只销毁非全局的 PreviewSkin 层
          const stage = kernel.ctx.engine?.stage;
          if (!stage) return;
          for (const child of [...stage.children]) {
            const name = String(child.name || '');
            if (name.startsWith('PreviewSkin:') && !name.includes(globalSceneId)) {
              try { stage.removeChild(child); } catch {}
              try { child.destroy({ children: true, texture: false, baseTexture: false }); } catch {}
            }
          }
        }

        const sm = kernel.ctx.system.stateMachine;
        const events = kernel.ctx.system.events;
        // 暴露事件总线和数据接口，便于测试/自动化脚本驱动运行时
        window.__OVO_EVENTS = events;
        window.__OVO_DATA = kernel.ctx.data;
        if (sm && events) {
          // 桥接全局事件总线到状态机：自动订阅所有状态迁移事件
          const eventIds = new Set();
          for (const state of blueprint.design.stateMachine.states) {
            if (state.on) {
              for (const eventId of Object.keys(state.on)) {
                eventIds.add(eventId);
              }
            }
          }
          for (const eventId of eventIds) {
            console.log('[Preview] 桥接事件:', eventId);
            events.on(eventId, (payload) => {
              console.log('[Preview] 收到事件:', eventId, payload);
              try {
                sm.transition(eventId, payload);
              } catch (e) {
                console.warn('[Preview] transition 失败:', eventId, e);
              }
            });
          }
        }
        if (sm) {
          statusEl.textContent = '状态: ' + sm.getState();

          // boot 自动推进兜底：初始状态为 boot 且存在迁移事件时，在事件桥接完成后自动触发
          const bootStateDef = blueprint.design?.stateMachine?.states?.find((s) => s.id === 'boot');
          if (sm.getState() === 'boot' && bootStateDef?.on) {
            const bootEvents = Object.keys(bootStateDef.on);
            if (bootEvents.length > 0 && events) {
              const eventToEmit = bootEvents[0];
              requestAnimationFrame(() => {
                console.log('[Preview] boot 自动推进:', eventToEmit);
                events.emit(eventToEmit, { auto: true });
              });
            }
          }

          sm.onStateChange((from, to) => {
            statusEl.textContent = '状态: ' + to;
            if (window.parent !== window) {
              window.parent.postMessage({ type: 'stateChanged', from, to, projectId: 'cp_1019_10158_pacman_city_v1' }, '*');
            }
            // 自动渲染新状态的皮肤（状态 ID → 场景 ID → 场景 skin）
            const stateDef = blueprint.design.stateMachine.states.find(s => s.id === to);
            const sceneId = stateDef?.scene || to;
            const sceneDef = blueprint.design.scenes.find(s => s.id === sceneId);
            const skinName = sceneDef?.skin || '';
            const skinRenderer = kernel.ctx.system?.skinRenderer;
            if (skinRenderer?.renderSkinForScene) {
              // 先渲染全局皮肤（如果未渲染）
              renderGlobalSkin(skinRenderer);
              // 只销毁当前状态皮肤，保留全局皮肤
              const globalStateId = blueprint.design?.stateMachine?.globalState;
              const globalStateDef = globalStateId ? blueprint.design?.stateMachine?.states?.find(s => s.id === globalStateId) : null;
              const globalSceneId = globalStateDef?.scene || globalStateId || '';
              destroyActiveSkinOnly(skinRenderer, globalSceneId);
              // 渲染新状态皮肤
              try {
                const activeScene = { id: sceneId, skin: skinName, event: kernel.ctx.scene?.event, ui: kernel.ctx.scene?.ui };
                skinRenderer.renderSkinForScene(blueprint, activeScene, kernel.ctx.engine.stage);
              } catch (e) {
                console.warn('[Preview] 皮肤渲染失败:', e);
              }
            }
          });
          // 渲染初始状态皮肤（先全局，后当前）
          const skinRenderer = kernel.ctx.system?.skinRenderer;
          if (skinRenderer?.renderSkinForScene) {
            // 先渲染全局皮肤
            await renderGlobalSkin(skinRenderer);
            // 再渲染初始状态皮肤
            const initialStateDef = blueprint.design.stateMachine.states.find(s => s.id === sm.getState());
            const initialSceneId = initialStateDef?.scene || sm.getState();
            const initialSceneDef = blueprint.design.scenes.find(s => s.id === initialSceneId);
            const initialSkinName = initialSceneDef?.skin || '';
            try {
              const activeScene = { id: initialSceneId, skin: initialSkinName, event: kernel.ctx.scene?.event, ui: kernel.ctx.scene?.ui };
              await skinRenderer.renderSkinForScene(blueprint, activeScene, kernel.ctx.engine.stage);
            } catch (e) {
              console.warn('[Preview] 初始皮肤渲染失败:', e);
            }
          }
        }

        // Canvas 缩放以适应 preview iframe（使用设计尺寸，避免 PIXI autoDensity 改变 canvas.width 后缩放失真）
        const designWidth = Number(canvas.dataset.designWidth || canvas.width);
        const designHeight = Number(canvas.dataset.designHeight || canvas.height);
        function fitCanvas() {
          const container = canvas.parentElement;
          if (!container) return;
          const scale = Math.min(container.clientWidth / designWidth, container.clientHeight / designHeight, 1);
          canvas.style.width = (designWidth * scale) + 'px';
          canvas.style.height = (designHeight * scale) + 'px';
        }
        window.addEventListener('resize', fitCanvas);
        fitCanvas();

        if (window.parent !== window) {
          window.parent.postMessage({ type: 'previewReady', projectId: 'cp_1019_10158_pacman_city_v1' }, '*');
        }
      } catch (err) {
        statusEl.textContent = '错误: ' + err.message;
        statusEl.style.color = '#f87171';
        console.error('[Preview] 启动失败:', err);
      }
    }

    boot();

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'highlightState') {
        console.log('高亮状态:', e.data.stateId);
      }
    });
  </script>
</body>
</html>
