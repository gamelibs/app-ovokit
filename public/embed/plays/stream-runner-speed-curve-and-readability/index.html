<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>Stream Runner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; }
  #game-canvas { display: block; margin: 0 auto; max-width: 100%; max-height: 100%; width: auto; height: auto; }
  #preview-status {
    position: fixed; top: 8px; left: 8px; z-index: 10;
    padding: 4px 10px; border-radius: 4px; background: rgba(0,0,0,0.6);
    color: #4ade80; font-family: monospace; font-size: 11px;
  }
</style>
</head>
<body>
  <div id="preview-status" style="display:none">加载中...</div>
  <canvas id="game-canvas" data-design-width="750" data-design-height="1334"></canvas>
  <script type="module">

    import AudioModule from './kernel/v2-kernel/src/modules/audio-module.js';
    const statusEl = document.getElementById('preview-status');
    const canvas = document.getElementById('game-canvas');
    canvas.width = 750;
    canvas.height = 1334;

ult"}},"logic":{"nodes":[{"id":"enter-gameplay-onEnter-10","type":"onEnter","params":{}},{"id":"setData-11","type":"setData","params":{"key":"score","value":0}},{"id":"setData-13","type":"setData","params":{"key":"runnerGameOver","value":false}},{"id":"callAction-15","type":"callAction","params":{"moduleName":"core/runner","actionId":"start"}},{"id":"player-jump-onEvent-17","type":"onEvent","params":{"eventId":"player.jump"}},{"id":"callAction-18","type":"callAction","params":{"moduleName":"core/runner","actionId":"jump"}},{"id":"player-slide-onEvent-20","type":"onEvent","params":{"eventId":"player.slide"}},{"id":"callAction-21","type":"callAction","params":{"moduleName":"core/runner","actionId":"slide"}},{"id":"runner-finish-onEvent-23","type":"onEvent","params":{"eventId":"runner.finish"}},{"id":"setData-24","type":"setData","params":{"key":"score","value":"$event.score"}},{"id":"setData-26","type":"setData","params":{"key":"runnerDistance","value":"$event.distance"}},{"id":"setData-28","type":"setData","params":{"key":"runnerGameOver","value":true}},{"id":"emitEvent-30","type":"emitEvent","params":{"eventId":"game.over"}},{"id":"runner-update-high-score-onEvent-32","type":"onEvent","params":{"eventId":"runner.finish"}},{"id":"if-33","type":"if","params":{"expr":"ctx.data.get('score') > ctx.data.get('highScore')"}},{"id":"setData-34","type":"setData","params":{"key":"highScore","value":"$event.score"}}],"edges":[{"id":"edge-12","source":"enter-gameplay-onEnter-10","target":"setData-11"},{"id":"edge-14","source":"setData-11","target":"setData-13"},{"id":"edge-16","source":"setData-13","target":"callAction-15"},{"id":"edge-19","source":"player-jump-onEvent-17","target":"callAction-18"},{"id":"edge-22","source":"player-slide-onEvent-20","target":"callAction-21"},{"id":"edge-25","source":"runner-finish-onEvent-23","target":"setData-24"},{"id":"edge-27","source":"setData-24","target":"setData-26"},{"id":"edge-29","source":"setData-26","target":"setData-28"},{"id":"edge-31","source":"setData-28","target":"emitEvent-30"},{"id":"edge-35","source":"if-33","target":"setData-34","sourceHandle":"true"},{"id":"edge-36","source":"runner-update-high-score-onEvent-32","target":"if-33"}]}},{"id":"result","scene":"result","modules":["common-ui"],"on":{"game.restart":{"target":"gameplay"}},"logic":{"nodes":[{"id":"restart-game-onEvent-37","type":"onEvent","params":{"eventId":"game.restart"}},{"id":"emitEvent-38","type":"emitEvent","params":{"eventId":"game.start"}}],"edges":[{"id":"edge-39","source":"restart-game-onEvent-37","target":"emitEvent-38"}]}}]},"dataGraph":{"nodes":[{"id":"score","type":"state","initial":0,"persistent":false},{"id":"highScore","type":"state","initial":0,"persistent":false},{"id":"runnerDistance","type":"state","initial":0,"persistent":false},{"id":"runnerScore","type":"state","initial":0,"persistent":false},{"id":"runnerLives","type":"state","initial":5,"persistent":false},{"id":"runnerGameOver","type":"state","initial":false,"persistent":false},{"id":"runnerState","type":"state","initial":"idle","persistent":false},{"id":"runnerSpeed","type":"state","initial":30,"persistent":false},{"id":"gameDuration","type":"state","initial":5,"persistent":false}],"edges":[]},"events":{"definitions":[{"id":"boot.complete","label":"boot.complete","type":"event"},{"id":"game.start","label":"game.start","type":"event"},{"id":"game.over","label":"game.over","type":"event"},{"id":"game.restart","label":"game.restart","type":"event"},{"id":"player.jump","label":"player.jump","type":"event"},{"id":"player.slide","label":"player.slide","type":"event"},{"id":"runner.crash","label":"runner.crash","type":"event","schema":{"type":{"type":"scalar","dataType":"string"},"lives":{"type":"scalar","dataType":"number"},"distance":{"type":"scalar","dataType":"number"}}},{"id":"runner.finish","label":"runner.finish","type":"event","schema":{"distance":{"type":"scalar","dataType":"number"},"score":{"type":"scalar","dataType":"number"},"reason":{"type":"scalar","dataType":"string"}}}]}},"resources":[{"type":"libs","name":"pixi.min.js","url":"./resources/libs/pixi.min.js"}]};
    window.__BLUEPRINT__ = blueprint;
    window.__PROJECT_ID__ = 'cp_1019_10151_job_1782132365223_9dtiol';
    // SkinRenderer 等旧模块依赖 window.__OV.emitBootstrapLog / ovoLog
    window.__OV = window.__OV || {};
    window.__OV.emitBootstrapLog = function(level, args = [], detail = null) {
      const fn = { error: console.error, warn: console.warn, info: console.log, debug: console.debug, trace: console.trace }[level] || console.log;
      fn('[__OV]', ...(Array.isArray(args) ? args : [args]), detail != null ? detail : '');
    };
    window.__OV.ovoLog = function(...args) { console.log('[ovoLog]', ...args); };
    window.__RESOLVE_URL__ = function(path) {
      // 静态导出包：所有项目文件与 index.html 同目录，相对路径直接可用
      return path;
    };

    // 收集蓝图中引用的所有模块名
    function collectModuleNames(bp) {
      const names = new Set();
      (bp.kernel.globalModules || []).forEach((n) => names.add(n));
      (bp.design.stateMachine.states || []).forEach((s) => {
        (s.modules || []).forEach((n) => names.add(n));
      });
      return [...names];
    }

    // 动态从市场加载模块代码（静态导出时从本地 ./modules/ 目录取预编译 JS）
    async function loadMarketModule(name) {
      try {
        const resp = await fetch('./modules/' + name + '.js');
        if (!resp.ok) return null;
        const code = await resp.text();
        if (!code) return null;
        // 使用 Blob URL 动态加载 ESM 模块
        const blob = new Blob([code], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        const mod = await import(/* @vite-ignore */ url);
        URL.revokeObjectURL(url);
        return mod.default || mod;
      } catch (e) {
        console.warn('[Preview] 加载市场模块失败:', name, e);
        return null;
      }
    }

    async function boot() {
      try {
        const kernel = new OvoKernel();
        window.__kernel = kernel;
        kernel.canvas = canvas;

        kernel.register('__OV.EventBus', EventBusModule);
        kernel.register('__OV.Tool', ToolModule);
        kernel.register('__OV.Memory', MemoryModule);
        kernel.register('__OV.Save', SaveModule);
        kernel.register('__OV.DataChannel', DataChannelModule);
        kernel.register('__OV.Render', RenderModule);
        kernel.register('__OV.SkinRenderer', SkinRendererModule);
        kernel.register('__OV.Input', InputModule);
        kernel.register('__OV.Config', ConfigModule);
        kernel.register('__OV.Loader', LoaderModule);
        kernel.register('__OV.ResMgr', ResMgrModule);
        kernel.register('__OV.Audio', AudioModule);
        kernel.register('__OV.ProjectMgr', ProjectMgrModule);
        kernel.register('__OV.StateMachine', StateMachineModule);

        // 动态注册蓝图中引用的市场模块（Phase1 仅保留游戏模块）
        const moduleNames = collectModuleNames(blueprint);
        console.log('[Preview] 需要注册的模块:', moduleNames);
        for (const name of moduleNames) {
          // 系统 __OV 模块已提前注册；但场景私有游戏模块（__OV.Games.*）需要从市场加载
          const isSystem = name.startsWith('__OV.') && !name.startsWith('__OV.Games.');
          if (!isSystem && !kernel.modules.has(name)) {
            console.log('[Preview] 加载模块:', name);
            const mod = await loadMarketModule(name);
            if (mod) {
              kernel.register(name, mod);
              console.log('[Preview] 注册模块:', name);
            } else {
              console.warn('[Preview] 模块加载失败:', name);
            }
          }
        }

        // 使用蓝图原始 bootChain，过滤掉未注册的模块
        const kernelBlueprint = {
          ...blueprint.kernel,
          bootChain: blueprint.kernel.bootChain
            .map((group) => group.filter((name) => name.startsWith('__OV.') && kernel.modules.has(name)))
            .filter((group) => group.length > 0),
        };

        // 自动补全已注册但未在 bootChain 中的系统模块到最后一个非-StateMachine 组
        // 注意：排除游戏模块（__OV.Games.*），它们由 StateMachine 在场景加载时调度
        const bootChainSet = new Set(kernelBlueprint.bootChain.flat());
        const registeredExtras = [];
        for (const [name] of kernel.modules) {
          if (name.startsWith('__OV.') && !name.startsWith('__OV.Games.') && !bootChainSet.has(name)) {
            registeredExtras.push(name);
          }
        }
        if (registeredExtras.length > 0) {
          // 插入到 ProjectMgr/StateMachine 之前（如果存在），否则追加到末尾
          const smIndex = kernelBlueprint.bootChain.findIndex((g) => g.includes('__OV.StateMachine'));
          if (smIndex > 0) {
            kernelBlueprint.bootChain.splice(smIndex, 0, registeredExtras);
          } else {
            kernelBlueprint.bootChain.push(registeredExtras);
          }
        }

        // 如果 bootChain 为空或不合法，使用默认标准 bootChain
        const hasStateMachine = kernelBlueprint.bootChain.some((g) => g.includes('__OV.StateMachine'));
        if (kernelBlueprint.bootChain.length === 0 || !hasStateMachine) {
          kernelBlueprint.bootChain = [
            ['__OV.EventBus', '__OV.Tool'],
            ['__OV.Memory', '__OV.Save', '__OV.DataChannel'],
            ['__OV.Render'],
            ['__OV.Input'],
            ['__OV.ProjectMgr', '__OV.StateMachine'],
          ];
        }
        // 加载引擎运行时库并初始化渲染层（threejs 混合加载 pixi + three：PIXI 管皮肤/UI，THREE 供 3D 模块）
        const engine = 'other';
        const runtimeLibUrls = ['./resources/libs/pixi.min.js'];
        try {
          for (const url of runtimeLibUrls) {
            await new Promise((resolve, reject) => {
              const script = document.createElement('script');
              script.src = url;
              script.onload = resolve;
              script.onerror = reject;
              document.head.appendChild(script);
            });
          }
          if ((engine === 'pixi' || engine === 'other' || engine === 'threejs') && typeof window.PIXI !== 'undefined') {
            const app = new window.PIXI.Application({
              view: canvas,
              width: canvas.width,
              height: canvas.height,
              backgroundColor: 0x0f172a,
              resolution: window.devicePixelRatio || 1,
              autoDensity: true,
            });
            kernel.ctx.engine.pixi = window.PIXI;
            kernel.ctx.engine.stage = app.stage;
            kernel.ctx.engine.app = app;
            console.log('[Preview] PIXI 初始化完成');
          }
          // three.min.js 就绪即挂 ctx.engine.three——引擎级（engine=threejs）与模块级
          // （蓝图模块 provides 含 render:threejs，由 extraRuntimeLibs 追加加载）两条路径都覆盖；
          // engine.name 只在引擎级 threejs 时改写，避免干扰 pixi 项目的皮肤层判断
          if (typeof window.THREE !== 'undefined') {
            kernel.ctx.engine.three = window.THREE;
            if (engine === 'threejs') kernel.ctx.engine.name = 'threejs';
            console.log('[Preview] Three.js 运行时库已加载');
          } else if (engine === 'threejs') {
            console.warn('[Preview] threejs 项目但 THREE 未加载成功');
          }
          if (engine !== 'pixi' && engine !== 'other' && engine !== 'threejs') {
            console.log('[Preview] 引擎库已加载:', engine);
          }
        } catch (e) {
          console.warn('[Preview] 引擎库加载失败，将使用 Canvas 2D 回退:', e);
        }

        await kernel.loadBlueprint(kernelBlueprint);

        // 加载项目数据资源到 ResMgr（静态导出时读本地 manifest + 静态 JSON 文件）
        try {
          const resResp = await fetch('./resources/data/manifest.json');
          if (resResp.ok) {
            const resData = await resResp.json();
            const dataFiles = (resData.files || []);
            for (const fileName of dataFiles) {
              const dataResp = await fetch('./resources/data/' + encodeURIComponent(fileName));
              if (dataResp.ok) {
                const dataContent = await dataResp.json();
                const dataId = fileName.replace(/\.json$/, '');
                if (kernel.ctx.system?.resMgr?.registerData) {
                  kernel.ctx.system.resMgr.registerData(dataId, dataContent);
                  console.log('[Preview] 注册数据资源:', dataId);
                }
              }
            }
          }
        } catch (e) {
          console.warn('[Preview] 加载数据资源失败:', e);
        }

        // 全局皮肤渲染辅助函数
        let globalSkinRendered = false;
        async function renderGlobalSkin(skinRenderer) {
          if (globalSkinRendered) return;
          const globalStateId = blueprint.design?.stateMachine?.globalState;
          if (!globalStateId) return;
          const globalStateDef = blueprint.design?.stateMachine?.states?.find(s => s.id === globalStateId);
          if (!globalStateDef) return;
          const globalSceneId = globalStateDef.scene || globalStateId;
          const globalScene = blueprint.design?.scenes?.find(s => s.id === globalSceneId);
          const globalSkinName = globalStateDef.skin || globalScene?.skin || '';
          if (!globalSkinName) return;
          try {
            const globalSceneRuntime = { id: globalSceneId, skin: globalSkinName, event: kernel.ctx.scene?.event, ui: kernel.ctx.scene?.ui };
            await skinRenderer.renderSkinForScene(blueprint, globalSceneRuntime, kernel.ctx.engine.stage);
            globalSkinRendered = true;
            console.log('[Preview] 全局皮肤渲染完成:', globalSkinName);
          } catch (e) {
            console.warn('[Preview] 全局皮肤渲染失败:', e);
          }
        }

        function destroyActiveSkinOnly(skinRenderer, globalSceneId) {
          // 只销毁非全局的 PreviewSkin 层
          const stage = kernel.ctx.engine?.stage;
          if (!stage) return;
          for (const child of [...stage.children]) {
            const name = String(child.name || '');
            if (name.startsWith('PreviewSkin:') && !name.includes(globalSceneId)) {
              try { stage.removeChild(child); } catch {}
              try { child.destroy({ children: true, texture: false, baseTexture: false }); } catch {}
            }
          }
        }

        const sm = kernel.ctx.system.stateMachine;
        const events = kernel.ctx.system.events;
        // 暴露事件总线和数据接口，便于测试/自动化脚本驱动运行时
        window.__OVO_EVENTS = events;
        window.__OVO_DATA = kernel.ctx.data;
        if (sm && events) {
          // 桥接全局事件总线到状态机：自动订阅所有状态迁移事件
          const eventIds = new Set();
          for (const state of blueprint.design.stateMachine.states) {
            if (state.on) {
              for (const eventId of Object.keys(state.on)) {
                eventIds.add(eventId);
              }
            }
          }
          for (const eventId of eventIds) {
            console.log('[Preview] 桥接事件:', eventId);
            events.on(eventId, (payload) => {
              console.log('[Preview] 收到事件:', eventId, payload);
              try {
                sm.transition(eventId, payload);
              } catch (e) {
                console.warn('[Preview] transition 失败:', eventId, e);
              }
            });
          }
        }
        if (sm) {
          statusEl.textContent = '状态: ' + sm.getState();

          // boot 自动推进兜底：初始状态为 boot 且存在迁移事件时，在事件桥接完成后自动触发
          const bootStateDef = blueprint.design?.stateMachine?.states?.find((s) => s.id === 'boot');
          if (sm.getState() === 'boot' && bootStateDef?.on) {
            const bootEvents = Object.keys(bootStateDef.on);
            if (bootEvents.length > 0 && events) {
              const eventToEmit = bootEvents[0];
              requestAnimationFrame(() => {
                console.log('[Preview] boot 自动推进:', eventToEmit);
                events.emit(eventToEmit, { auto: true });
              });
            }
          }

          sm.onStateChange((from, to) => {
            statusEl.textContent = '状态: ' + to;
            if (window.parent !== window) {
              window.parent.postMessage({ type: 'stateChanged', from, to, projectId: 'cp_1019_10151_job_1782132365223_9dtiol' }, '*');
            }
            // 自动渲染新状态的皮肤（状态 ID → 场景 ID → 场景 skin）
            const stateDef = blueprint.design.stateMachine.states.find(s => s.id === to);
            const sceneId = stateDef?.scene || to;
            const sceneDef = blueprint.design.scenes.find(s => s.id === sceneId);
            const skinName = sceneDef?.skin || '';
            const skinRenderer = kernel.ctx.system?.skinRenderer;
            if (skinRenderer?.renderSkinForScene) {
              // 先渲染全局皮肤（如果未渲染）
              renderGlobalSkin(skinRenderer);
              // 只销毁当前状态皮肤，保留全局皮肤
              const globalStateId = blueprint.design?.stateMachine?.globalState;
              const globalStateDef = globalStateId ? blueprint.design?.stateMachine?.states?.find(s => s.id === globalStateId) : null;
              const globalSceneId = globalStateDef?.scene || globalStateId || '';
              destroyActiveSkinOnly(skinRenderer, globalSceneId);
              // 渲染新状态皮肤
              try {
                const activeScene = { id: sceneId, skin: skinName, event: kernel.ctx.scene?.event, ui: kernel.ctx.scene?.ui };
                skinRenderer.renderSkinForScene(blueprint, activeScene, kernel.ctx.engine.stage);
              } catch (e) {
                console.warn('[Preview] 皮肤渲染失败:', e);
              }
            }
          });
          // 渲染初始状态皮肤（先全局，后当前）
          const skinRenderer = kernel.ctx.system?.skinRenderer;
          if (skinRenderer?.renderSkinForScene) {
            // 先渲染全局皮肤
            await renderGlobalSkin(skinRenderer);
            // 再渲染初始状态皮肤
            const initialStateDef = blueprint.design.stateMachine.states.find(s => s.id === sm.getState());
            const initialSceneId = initialStateDef?.scene || sm.getState();
            const initialSceneDef = blueprint.design.scenes.find(s => s.id === initialSceneId);
            const initialSkinName = initialSceneDef?.skin || '';
            try {
              const activeScene = { id: initialSceneId, skin: initialSkinName, event: kernel.ctx.scene?.event, ui: kernel.ctx.scene?.ui };
              await skinRenderer.renderSkinForScene(blueprint, activeScene, kernel.ctx.engine.stage);
            } catch (e) {
              console.warn('[Preview] 初始皮肤渲染失败:', e);
            }
          }
        }

        // Canvas 缩放以适应 preview iframe（使用设计尺寸，避免 PIXI autoDensity 改变 canvas.width 后缩放失真）
        const designWidth = Number(canvas.dataset.designWidth || canvas.width);
        const designHeight = Number(canvas.dataset.designHeight || canvas.height);
        function fitCanvas() {
          const container = canvas.parentElement;
          if (!container) return;
          const scale = Math.min(container.clientWidth / designWidth, container.clientHeight / designHeight, 1);
          canvas.style.width = (designWidth * scale) + 'px';
          canvas.style.height = (designHeight * scale) + 'px';
        }
        window.addEventListener('resize', fitCanvas);
        fitCanvas();

        if (window.parent !== window) {
          window.parent.postMessage({ type: 'previewReady', projectId: 'cp_1019_10151_job_1782132365223_9dtiol' }, '*');
        }
      } catch (err) {
        statusEl.textContent = '错误: ' + err.message;
        statusEl.style.color = '#f87171';
        console.error('[Preview] 启动失败:', err);
      }
    }

    boot();

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'highlightState') {
        console.log('高亮状态:', e.data.stateId);
      }
    });
  </script>
</body>
</html>
